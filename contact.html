<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book / Enquire · Sivaprasad NN</title>
<meta name="description" content="Book Sivaprasad NN for a performance, enrol in online classes, request a corporate Music Therapy workshop, or commission an ensemble.">
<meta property="og:image" content="assets/photos/portrait/portrait-green.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700family=Cormorant+Garamond:wght@500;600;700&family=Marcellus&family=Spectral:wght@400;500;600&display=swapfamily=Inter:wght@300;400;500;600;700family=Cormorant+Garamond:wght@500;600;700&family=Marcellus&family=Spectral:wght@400;500;600&display=swapfamily=Spectral:wght@400;500;600family=Cormorant+Garamond:wght@500;600;700&family=Marcellus&family=Spectral:wght@400;500;600&display=swapdisplay=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<header class="pagehead" style="min-height:40vh">
  <div class="bg"><img src="assets/photos/hero/hero-orange.jpg" alt="Sivaprasad NN"></div>
  <div class="inner wrap">
    <p class="kicker">Get in touch</p>
    <h1 class="display">Start the conversation.</h1>
  </div>
</header>

<section>
  <div class="wrap split" style="align-items:start">
    <!-- FORM -->
    <div class="form reveal">
      <p class="kicker">What can we help with?</p>
      <div class="tabs">
        <button class="tab active" data-tab="perform">Book a performance</button>
        <button class="tab" data-tab="classes">Online classes</button>
        <button class="tab" data-tab="workshop">Music Therapy</button>
        <button class="tab" data-tab="ensemble">Ensemble</button>
      </div>

      <!-- IMPORTANT: replace the e-mail in the action below to route enquiries.
           First submission triggers a one-time confirmation email from FormSubmit. -->
      <form action="https://formsubmit.co/sivaprasadnn@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Website enquiry: Book a performance">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" style="display:none">

        <div class="field"><label>Your name</label><input type="text" name="Name" required></div>
        <div class="field"><label>Email</label><input type="email" name="Email" required></div>
        <div class="field"><label>Phone / WhatsApp</label><input type="text" name="Phone"></div>

        <!-- intent-specific panes -->
        <div class="tabpane" data-pane="perform">
          <div class="field"><label>Type of performance</label>
            <select name="Performance type"><option>Solo Carnatic concert</option><option>Lead vocal for dance ballet / arangetram</option><option>Fusion / jugalbandi</option><option>Not sure yet</option></select></div>
          <div class="field"><label>Tell us about the event</label><textarea name="Details" rows="4" placeholder="Occasion, city and anything else we should know."></textarea></div>
        </div>
        <div class="tabpane" data-pane="classes" style="display:none">
          <div class="field"><label>Student level</label>
            <select name="Level"><option>Beginner</option><option>Intermediate</option><option>Professional</option></select></div>
          <div class="field"><label>Where are you based?</label><input type="text" name="Location"></div>
          <div class="field"><label>Anything else</label><textarea name="Details" rows="3" placeholder="Preferred timing, goals, etc."></textarea></div>
        </div>
        <div class="tabpane" data-pane="workshop" style="display:none">
          <div class="field"><label>Organisation</label><input type="text" name="Organisation"></div>
          <div class="field"><label>Team size</label><input type="text" name="Team size"></div>
          <div class="field"><label>What are you looking for?</label><textarea name="Details" rows="3" placeholder="Context for the Music Therapy session."></textarea></div>
        </div>
        <div class="tabpane" data-pane="ensemble" style="display:none">
          <div class="field"><label>Ensemble needed</label>
            <select name="Ensemble"><option>Solo concert</option><option>Dance accompaniment</option><option>Fusion ensemble</option><option>Full orchestra</option></select></div>
          <div class="field"><label>Event details</label><textarea name="Details" rows="4" placeholder="Occasion, city, rough dates, size of programme."></textarea></div>
        </div>

        <button type="submit" class="btn" style="width:100%">Send enquiry</button>
      </form>
    </div>

    <!-- DIRECT DETAILS -->
    <div class="reveal">
      <p class="kicker">Prefer to reach out directly?</p>
      <h2 class="display">A message is all it takes.</h2>
      <ul class="awards" style="margin-bottom:24px">
        <li><span class="yr">&#9742;</span><span class="ti"><a id="c-phone" href="#">Call</a></span></li>
        <li><span class="yr">&#9993;</span><span class="ti"><a id="c-email" href="#">Email</a></span></li>
        <li><span class="yr">&#128172;</span><span class="ti"><a id="c-wa" href="#" target="_blank" rel="noopener">WhatsApp</a></span></li>
        <li><span class="yr">&#128205;</span><span class="ti">Vashi, Navi Mumbai, India</span></li>
      </ul>
      <div class="frame" style="box-shadow:none">
        <iframe title="Location" src="https://www.google.com/maps?q=Vashi,Navi%20Mumbai&output=embed" width="100%" height="300" style="border:0" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  // fill direct-contact links from data.js
  (function(){var C=(window.SITE||{}).contact||{};
    var p=document.getElementById('c-phone'); if(p){p.href='tel:'+(C.phoneRaw||'');p.textContent=C.phone||'Call';}
    var e=document.getElementById('c-email'); if(e){e.href='mailto:'+(C.email||'');e.textContent=C.email||'Email';}
    var w=document.getElementById('c-wa'); if(w){w.href='https://wa.me/'+(C.phoneRaw||'');w.textContent='WhatsApp '+(C.phone||'');}
  })();
</script>
</body>
</html>
